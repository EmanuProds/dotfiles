# ============================================================
# gnome-settings.ini — configurações do GNOME para o Fedora.
#
# Origem: dump dconf da máquina CachyOS de referência, já filtrado.
# Ficou de fora, de propósito:
#   - estado pessoal e histórico (janelas, abas, últimos arquivos, uso)
#   - caminhos absolutos /home/emanuel (papel de parede, últimas pastas)
#   - schemas de apps que o fedoraPI.sh não instala (virt-manager, Weather,
#     Showtime, Papers, Ptyxis, Evolution, Boxes, Clocks, Bazaar…)
#   - permissões de portal/flatpak (conflitam com o sandbox recém-instalado)
#   - atalhos de apps ausentes (Ptyxis, fish, wofi…)
# Mantido: interface/GTK/cursor, atalhos do GNOME, layouts de teclado,
# energia e bateria, temas das extensões instaladas e o dock (favorite-apps).
#
# Aplicação (fase 8/12 do fedoraPI.sh):
#   dconf load / < gnome-settings.ini
# ============================================================

[io/github/realmazharhussain/GdmSettings]
initial-warning=false
never-applied=false

[io/github/realmazharhussain/GdmSettings/accessibility]
always-show-accessibility-menu=false

[io/github/realmazharhussain/GdmSettings/appearance]
accent-color='slate'
cursor-theme='Adwaita'
icon-theme='Adwaita-slate'

[io/github/realmazharhussain/GdmSettings/fonts]
antialiasing='grayscale'
font='Adwaita Sans 11'
hinting='full'
scaling-factor=1.1499999999999999

[io/github/realmazharhussain/GdmSettings/misc]
disable-restart-buttons=false
disable-user-list=false
enable-logo=false
enable-welcome-message=false
enlarge-welcome-message=false
welcome-message=''

[io/github/realmazharhussain/GdmSettings/mouse]
natural-scrolling=false
pointer-acceleration='default'
speed=0.0

[io/github/realmazharhussain/GdmSettings/night-light]
enabled=true
end-hour=6
end-minute=0
schedule-automatic=false
start-hour=18
start-minute=0
temperature=uint32 3700

[io/github/realmazharhussain/GdmSettings/pointing]
cursor-size=24

[io/github/realmazharhussain/GdmSettings/power]
auto-power-saver=true
blank-screen=true
dim-screen=true
idle-delay=15.0
power-button-action='suspend'
suspend-on-ac=true
suspend-on-ac-delay=60.0
suspend-on-battery=true
suspend-on-battery-delay=30.0

[io/github/realmazharhussain/GdmSettings/sound]
event-sounds=true
feedback-sounds=false
over-amplification=true
theme='freedesktop'

[io/github/realmazharhussain/GdmSettings/top-bar]
show-battery-percentage=true
show-date=true
show-seconds=true
show-weekday=false
time-format='24h'

[io/github/realmazharhussain/GdmSettings/touchpad]
disable-on-external-mouse=false
disable-while-typing=true
enable=true
natural-scrolling=true
speed=0.0
tap-to-click=true
two-finger-scrolling=true

[io/github/seadve/Kooha]
profile-id='matroska-h264'
record-microphone=true
show-pointer=true

[net/nokyan/Resources]
last-viewed-page='processes'
processes-sort-by-ascending=false

[org/gnome/Console]
theme='auto'

[org/gnome/TextEditor]
highlight-current-line=true
restore-session=false
show-line-numbers=true
show-map=false
show-right-margin=false
style-scheme='Adwaita-dark'

[org/gnome/calculator]
base=10
button-mode='basic'
source-units=['degree']
target-units=['radian']
unit-category='angle'

[org/gnome/calendar]
active-view='month'

[org/gnome/desktop/break-reminders/eyesight]
play-sound=true

[org/gnome/desktop/break-reminders/movement]
duration-seconds=uint32 300
interval-seconds=uint32 1800
play-sound=true

[org/gnome/desktop/calendar]
show-weekdate=true

[org/gnome/desktop/datetime]
automatic-timezone=true

[org/gnome/desktop/input-sources]
sources=[('xkb', 'br')]
xkb-options=['terminate:ctrl_alt_bksp']

[org/gnome/desktop/interface]
accent-color='slate'
clock-show-seconds=true
color-scheme='prefer-dark'
enable-animations=true
enable-hot-corners=false
font-hinting='full'
gtk-theme='adw-gtk3-dark'
icon-theme='Adwaita-slate'
locate-pointer=true
monospace-font-name='JetBrainsMono Nerd Font 11'
text-scaling-factor=1.0

[org/gnome/desktop/notifications]
show-banners=true

[org/gnome/desktop/peripherals/keyboard]
numlock-state=true

[org/gnome/desktop/peripherals/touchpad]
send-events='enabled'
two-finger-scrolling-enabled=true

[org/gnome/desktop/privacy]
old-files-age=uint32 7
remove-old-temp-files=true
remove-old-trash-files=true

[org/gnome/desktop/screen-time-limits]
daily-limit-seconds=uint32 28800

[org/gnome/desktop/search-providers]
sort-order=['org.gnome.Settings.desktop', 'org.gnome.Contacts.desktop', 'org.gnome.Nautilus.desktop']

[org/gnome/desktop/session]
idle-delay=uint32 900

[org/gnome/desktop/sound]
allow-volume-above-100-percent=true

[org/gnome/desktop/wm/keybindings]
maximize=['<Super>Up']
unmaximize=['<Super>Down', '<Alt>F5']

[org/gnome/desktop/wm/preferences]
button-layout='appmenu:close'
focus-mode='click'

[org/gnome/file-roller/dialogs/extract]
recreate-folders=true
skip-newer=false

[org/gnome/file-roller/listing]
list-mode='as-folder'

[org/gnome/gnome-system-monitor]
current-tab='disks'
show-dependencies=false
show-whose-processes='user'

[org/gnome/mutter]
attach-modal-dialogs=true
edge-tiling=true

[org/gnome/nautilus/icon-view]
captions=['size', 'none', 'date_modified']
default-zoom-level='medium'

[org/gnome/nautilus/list-view]
use-tree-view=true

[org/gnome/nautilus/preferences]
show-create-link=true
show-delete-permanently=true

[org/gnome/settings-daemon/plugins/color]
night-light-enabled=false
night-light-schedule-automatic=false
night-light-schedule-from=18.0
night-light-temperature=uint32 3700

[org/gnome/settings-daemon/plugins/power]
sleep-inactive-ac-timeout=3600
sleep-inactive-ac-type='suspend'
sleep-inactive-battery-timeout=1800

[org/gnome/shell]
disabled-extensions=['Bluetooth-Battery-Meter@maniacx.github.com', 'rounded-window-corners@fxgn', 'shotzy@SamkitJain660.github.io', 'soft-brightness-plus@joelkitching.com', 'tilingshell@ferrarodomenico.com']
