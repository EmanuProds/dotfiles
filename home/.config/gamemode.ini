# GameMode — Lenovo IdeaPad 3 15ALC6 (Ryzen 5 5500U / Vega / 25W)
#
# Schema do gamemode 1.8.2. A seção [custom] NÃO aceita mais governor/renice
# (ver nota no fim do arquivo) — de lá saem apenas scripts start=/end=.
#
# Driver de frequência confirmado: amd-pstate-epp
# Governors disponíveis: performance, powersave
#
# ========================================================================
#  ACAO NECESSARIA ANTES DE USAR - LEIA PRIMEIRO
#
#  Este arquivo esta CORRETO, mas hoje nao tem efeito nenhum.
#  O gamemode 1.8.2 escala privilegio via pkexec para rodar os helpers
#  em /usr/lib/gamemode/ (cpugovctl, procsysctl, ...).
#  Sem o usuario no grupo `gamemode`, o pkexec falha:
#
#    pkexec: emanuel: Error executing command as another user:
#            Not authorized [COMMAND=.../cpugovctl set performance]
#    gamemoded: Failed to update cpu governor policy
#
#  Rode isto e reconecte a sessao (logout/login):
#
#      sudo usermod -aG gamemode emanuel
#
#  So depois de adicionar E reconectar, descomente renice=10 abaixo.
# ========================================================================
#
# -- O QUE E NAO-PADRAO AQUI ----------------------------------------------
#   desiredgov=performance   -> explicito (ja e o default, fixado aqui).
#                               NAO FUNCIONA sem o grupo gamemode acima.
#   inhibit_screensaver=1    -> default, critico aqui porque o jogo roda no
#                               monitor IPS externo e o painel TN interno
#                               fica ocioso (e nele que o screensaver dispara)
#   renice=10                -> NAO-PADRAO. Comente ate adicionar o usuario
#                               ao grupo gamemode (ver bloco acima)
#   igpu_desiredgov          -> comentado de proposito. Ver nota abaixo.
# ----------------------------------------------------------------------

[general]

# Governor do CPU durante o jogo.
# performance = sem scaling de boost, teto de 4,0 GHz no 5500U.
# Tradeoff: esquenta mais num chassi de 1,99 mm, o que pode reduzir o clock
# sustentado. Se sentir queda de FPS depois de ~15 min, volte para powersave.
desiredgov=performance

# Ao sair do jogo, restaurar o governor original em vez de forçar powersave.
# Deixe comentado: gov original é o comportamento correto fora do jogo.
;defaultgov=powersave

# Impede que o screensaver ative durante o jogo.
# Relevante NESTA máquina: o jogo roda no monitor externo e o painel TN
# interno fica ocioso. Sem isto, o screensaver entra e escurece a imagem.
inhibit_screensaver=1

# Desativa a mitigação de split lock durante o jogo. Default do upstream.
disable_splitlock=1

# Prioridade de I/O em best-effort/0 (0 = mais alta). Default do upstream.
# NÃO mude para "realtime": ganho mínimo e faz o GNOME travar durante o jogo.
ioprio=0

# Prioridade de CPU para o processo do jogo. O valor é aplicado com sinal
# invertido, então 10 = nice -10.
# COMENTADO porque é preciso estar no grupo gamemode. Sem isso o valor e
# ignorado silenciosamente e parece funcionar. Descomente depois de rodar:
#     sudo usermod -aG gamemode emanuel
# e reconectar a sessao (logout/login) para a mudanca de grupo ter efeito.
;renice=10

# ── iGPU ─────────────────────────────────────────────────────────────────
# COMENTADO DE PROPÓSITO — leia antes de mexer.
#
# O padrao do upstream e igpu_desiredgov=powersave, que baixa o clock da iGPU
# quando a potencia da CPU domina a da GPU. Essa heuristica foi feita para
# notebook com GPU DEDICADA, onde a iGPU so conduz a tela.
#
# Aqui NAO existe GPU dedicada: a Vega e a unica GPU, e ela renderiza o jogo.
# Baixar o clock dela deve PREJUDICAR, nao ajudar.
#
# Nao deixei igpu_desiredgov=performance ativo por descuido: nao tenho certeza
# de qual sysfs o gamemode 1.8.2 escreve em hardware AMD, e o
# power_dpm_force_performance_level so aceita auto/low/high/manual — um valor
# invalido faz a escrita falhar. Sem baseline de FPS nao dá para afirmar ganho.
#
# COMO EXPERIMENTAR (faca com o jogo rodando, anote o FPS):
#     echo performance > /sys/class/drm/card1/device/power_dpm_force_performance_level
# e compare. Se ajudar, descomente a linha abaixo.
;igpu_desiredgov=performance

# Limiar iGPU Watts / CPU Watts que dispara a troca de governor da iGPU.
# -1 desliga a checagem e sempre usa desiredgov.
;igpu_power_threshold=0.3

# SCHED_ISO. Nao suportado por kernels upstream, deixar off.
softrealtime=off

# Intervalo do thread que checa clientes encerrados e mudanças de config.
reaper_freq=5


# ── GPU ──────────────────────────────────────────────────────────────────
# DEIXADO COMENTADO DE PROPOSITO.
# power_dpm_force_performance_level ja esta em "auto", que e o correto.
# A secao [gpu] e marcada "Here Be Dragons" no upstream e exige
# apply_gpu_optimisations=accept-responsibility. Nao ha ganho a buscar aqui
# num SoC de 25W, e errar o valor pode deixar a GPU presa em estado ruim.
;[gpu]
;apply_gpu_optimisations=0
;gpu_device=1
;amd_performance_level=high


# ── CPU (pinning/parking) ────────────────────────────────────────────────
# DEIXADO COMENTADO DE PROPOSITO.
# O autodetect do gamemode so cobre Ryzen 7900x3d, 7950x3d e CPUs Intel com
# E-/P-cores hibridos. O 5500U e Zen 2 homogeneo (6C/12T, sem CCD
# separado), entao pinning nao tem o que resolver aqui.
# Alem disso, park_cores exige o grupo gamemode.
;[cpu]
;park_cores=no
;pin_cores=yes


# ── supervisor ───────────────────────────────────────────────────────────
; Nao usado por Steam. Deixe como esta.
;[supervisor]
;require_supervisor=0


# ── [custom]: APENAS scripts shell ───────────────────────────────────────
# Em 1.8.2 esta secao serve para start=/end= e script_timeout=.
# Nao aceita mais governor, renice, ioprio ou cgroup — quem controla isso e a
# secao [general] acima. Foi este o erro da primeira versao deste arquivo.
;[custom]
;start=
;end=
;script_timeout=10


# ── Como verificar se esta funcionando ───────────────────────────────────
#
#   gamemoded --status          -> deve responder "gamemode is on"
#   cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor
#                                  -> deve mostrar "performance" DURANTE o jogo
#   sensors | grep -i temp       -> watch o throttle do SoC
#
# Se o governor nao mudar para performance durante o jogo, o gamemode nao esta
# ativando. O gamemoded e um servico de USUARIO
# (/usr/lib/systemd/user/gamemoded.service), entao:
#
#   systemctl --user status gamemoded
#   systemctl --user enable --now gamemoded     # para iniciar no login
#
# Lembre-se: XDG_DIAGNOSTICS ou override e necessario se o launcher nao
# ativar o gamemode. No Steam, a forma e o launch option "gamemoderun %command%".
